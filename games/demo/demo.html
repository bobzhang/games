<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MoonBit Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #canvas-container {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#canvas {
      display: block;
      background: #000;
      border: none;
      outline: none;
      max-width: 100%;
      max-height: 100%;
      /* On mobile, fill the screen */
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0a0e1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e8edf5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      z-index: 100;
      transition: opacity 0.3s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading h2 { font-size: 20px; margin-bottom: 16px; color: #818cf8; }
    #loading .bar-bg {
      width: 200px; height: 6px; border-radius: 3px;
      background: #1e293b; overflow: hidden;
    }
    #loading .bar-fill {
      height: 100%; background: #6366f1; border-radius: 3px;
      transition: width 0.15s;
    }
    #loading .status { margin-top: 10px; font-size: 13px; color: #8899b0; }
    #back-link {
      position: fixed; top: 8px; left: 8px; z-index: 50;
      background: rgba(0,0,0,0.6); color: #ccc;
      padding: 6px 12px; border-radius: 6px;
      font-size: 13px; text-decoration: none;
      font-family: -apple-system, sans-serif;
      backdrop-filter: blur(4px);
      opacity: 0.7; transition: opacity 0.2s;
    }
    #back-link:hover { opacity: 1; color: #fff; }
    /* Hide emscripten UI chrome - we use our own */
    #emscripten_logo, #controls, #output, .spinner,
    div.emscripten:not(#canvas-container):not(.emscripten_border) { display: none !important; }
  </style>
</head>
<body>
  <a id="back-link" href="/">← Back to Games</a>
  <div id="loading">
    <h2>Loading Game...</h2>
    <div class="bar-bg"><div class="bar-fill" id="progress-bar" style="width:0%"></div></div>
    <div class="status" id="status-text">Initializing...</div>
  </div>
  <div id="canvas-container">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>
  <script>
    var canvasElement = document.getElementById('canvas');
    // Focus canvas for keyboard input
    canvasElement.addEventListener('click', function() { canvasElement.focus(); });
    window.addEventListener('load', function() { canvasElement.focus(); });

    // Handle canvas context loss gracefully
    canvasElement.addEventListener('webglcontextlost', function(e) {
      e.preventDefault();
      document.getElementById('status-text').textContent = 'WebGL context lost. Please reload.';
      document.getElementById('loading').classList.remove('hidden');
    });

    var Module = {
      canvas: canvasElement,
      print: function(text) { console.log(text); },
      printErr: function(text) { console.warn(text); },
      setStatus: function(text) {
        var el = document.getElementById('status-text');
        var bar = document.getElementById('progress-bar');
        if (!text) {
          // Done loading
          document.getElementById('loading').classList.add('hidden');
          canvasElement.focus();
          return;
        }
        el.textContent = text;
        // Parse progress from "Downloading... (X/Y)"
        var m = text.match(/(\d+(\.\d+)?)\/(\d+)/);
        if (m) {
          var pct = (parseFloat(m[1]) / parseFloat(m[3]) * 100).toFixed(0);
          bar.style.width = pct + '%';
        }
      },
      onRuntimeInitialized: function() {
        document.getElementById('loading').classList.add('hidden');
        canvasElement.focus();
      }
    };

    // Resize canvas to fill viewport
    function resizeCanvas() {
      var w = window.innerWidth;
      var h = window.innerHeight;
      canvasElement.style.width = w + 'px';
      canvasElement.style.height = h + 'px';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
  <script async type="text/javascript" src="demo.js"></script>
</body>
</html>
